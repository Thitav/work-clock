[package]
name = "rust-work-clock"
version = "0.1.0"
edition = "2024"

[features]
cli = ["dep:clap", "dep:humantime", "dep:anyhow", "dep:serde_json", "time/formatting", "time/macros", "time/local-offset"]

[dependencies]
anyhow = { version = "1.0.101", optional = true }
clap = { version = "4.5.58", features = ["derive"], optional = true }
humantime = { version = "2.3.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde"] }

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]
